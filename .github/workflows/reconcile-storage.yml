name: Reconcile storage (orphan sweep)

# Finds stranded photo objects (no `photos` row, older than a 24h grace
# window) in the tree-photos bucket — the storage-first/DB-second upload can
# orphan bytes if a tab closes mid-upload. Requires the SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY repository Action secrets and FAILS LOUD without
# them. The service-role key lives ONLY here, never in the app runtime.
#
# DELETION POLICY (2026-09): the SCHEDULED monthly run is REPORT-ONLY — it
# lists orphan candidates and never deletes. At beta scale (a handful of
# objects) unattended deletion of user photos is not worth its risk. The only
# way to delete is a MANUAL "Run workflow" with the dry_run box explicitly
# UNTICKED, after reading a dry-run listing. The script enforces the same
# fail-safe rule independently of the step below (it deletes ONLY when
# GITHUB_EVENT_NAME=workflow_dispatch AND DRY_RUN=false; anything else,
# including a bare local invocation, is report-only), so no single mistake can
# turn the cron destructive.

on:
  schedule:
    - cron: "0 4 1 * *" # monthly, the 1st at 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List orphans without deleting (untick ONLY after reviewing a dry-run listing — this deletes user photos)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deleting mode requires BOTH: a manual dispatch AND dry_run explicitly
      # false. Every other combination (any scheduled run; a manual run with the
      # default dry_run=true) is report-only. Spelled out this way on purpose:
      # GitHub expressions treat a missing input (`null`, as on a schedule
      # event) as equal to `false`, so the shorter `inputs.dry_run == true`
      # form silently made scheduled runs DELETE.
      - name: Resolve mode (scheduled = always report-only)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DELETING mode — manual dispatch with dry_run unticked. Orphans older than 24h WILL be removed (subject to the script's pathology guard)."
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Report-only mode (event: ${{ github.event_name }}). Nothing will be deleted."
          fi

      - name: Reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: node scripts/reconcile-storage.mjs

      - name: Open an ops-alert issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ops alert: ${{ github.workflow }} failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Scheduled workflow failed: $run_url — triage steps in docs/operations/runbook.md."
          fi
