name: Keep Supabase warm

# Free Supabase projects are paused when they show LOW activity over the
# previous 7 days (Risk R1) — Supabase's guidance is that "a few user requests
# to the database each day" is enough. One ping every 3 days was NOT: the
# project went unreachable in Aug 2026 with that cadence, so this now pings
# three times a day. Each ping runs a real (RLS-scoped, empty-for-anon) table
# read so the database itself sees activity. NOTE: it deliberately queries a
# table endpoint, NOT /rest/v1/ — the bare REST root requires a SECRET key
# under the 2026 API key system and answers 401 to publishable keys.
#
# A ping can only keep an ACTIVE project awake. It cannot resume a paused one —
# that needs the owner in the dashboard (Resume project). A red run here is the
# signal to go and look.
#
# The 200 relies on the HOSTED project's default anon table grants (RLS still
# returns zero rows); the repo's migrations grant only `authenticated`, so a
# project rebuilt strictly from migrations would answer 401/403 here — the run
# would turn red and file an alert, at which point either add a keep-warm
# `grant select on public.species to anon` or switch the ping to
# /auth/v1/health.
#
# Requires the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository Action
# secrets (see docs/setup/04-environment-variables.md). This workflow FAILS
# LOUD: missing secrets or a non-2xx response turn the run red and file an
# ops-alert issue — a green run means the project really was pinged.
# Scheduled workflows run from the default branch only, and GitHub disables
# them after ~60 days without repo activity (see the runbook).

on:
  schedule:
    - cron: "0 */8 * * *" # three times a day: 00:00, 08:00, 16:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (RLS-scoped table read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set — keep-warm is NOT protecting the project. Add them (exact names, no NEXT_PUBLIC_ prefix)."
            exit 1
          fi
          # Two separate facts are captured: curl's own exit status (transport:
          # DNS, TCP, TLS, timeout) and the HTTP status (only meaningful when curl
          # exited 0). The Aug 2026 outage was logged as a bare "HTTP 000", which
          # hid whether the host failed to resolve or the request timed out.
          # This step runs under bash -e, so the `|| rc=$?` keeps a transport
          # failure from killing the step before it is diagnosed.
          # curl's stderr is deliberately NOT shown: its messages embed the host
          # name, and the URL is a secret here.
          rc=0
          code=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/species?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" 2>/dev/null) || rc=$?

          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              6)  why="could not resolve host (DNS)" ;;
              7)  why="could not connect (TCP refused/unreachable)" ;;
              28) why="timed out after 60s" ;;
              35) why="TLS handshake failed" ;;
              60) why="TLS certificate could not be verified" ;;
              *)  why="see https://curl.se/docs/manpage.html#EXIT" ;;
            esac
            echo "::error::TRANSPORT FAILURE — curl exit $rc ($why). No HTTP response was received, so this is NOT an HTTP status. Possible causes: wrong SUPABASE_URL, a network/DNS problem, or the project being unreachable (a paused Free project normally answers HTTP 540, but unresolvable hosts were seen in the Aug 2026 outage). Check the Supabase dashboard; a paused project must be resumed there — this ping cannot do it. See docs/operations/runbook.md#keep-warm-free-tier-pause--r1."
            exit 1
          fi

          case "$code" in
            2*)
              echo "Supabase responded with HTTP $code — database queried, project is active." ;;
            540)
              echo "::error::HTTP 540 — Supabase reports the project is PAUSED. Keep-warm cannot resume it: open the Supabase dashboard → Resume project, then re-run this workflow. See docs/operations/runbook.md#keep-warm-free-tier-pause--r1."
              exit 1 ;;
            401)
              echo "::error::HTTP 401 — the request reached Supabase but the key was rejected. Check that SUPABASE_PUBLISHABLE_KEY is the current publishable key (sb_publishable_…). See docs/operations/runbook.md#keep-warm-free-tier-pause--r1."
              exit 1 ;;
            *)
              echo "::error::HTTP $code — the request reached Supabase but did not succeed. 5xx = Supabase-side problem (check status.supabase.com); 4xx = URL/key/grant problem. See docs/operations/runbook.md#keep-warm-free-tier-pause--r1."
              exit 1 ;;
          esac

      - name: Open an ops-alert issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ops alert: ${{ github.workflow }} failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Scheduled workflow failed: $run_url — triage steps in docs/operations/runbook.md."
          fi
